<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project Details · ACT</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app-shell">
    <header class="header-bar">
      <div class="header-left">
        <button class="sidebar-toggle" data-sidebar-toggle aria-label="Toggle sidebar">
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/><path d="M14 9l-2 3 2 3"/></svg>
        </button>
        <div class="brand"><span class="mark">A</span><span class="brand-name">ACT</span></div>
      </div>
      <div class="header-right">
        <div class="profile-pill">
          <div class="avatar" data-user-avatar>—</div>
          <div class="who">
            <div class="name" data-user-name>—</div>
            <div class="role">Manager</div>
          </div>
        </div>
      </div>
    </header>

    <div class="body-row">
      <div class="sidebar-scrim" data-scrim></div>

      <aside class="sidebar">
        <ul class="nav-list">
          <li><a class="nav-link" data-page="dashboard" href="dashboard.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg></span><span class="label">Dashboard</span></a></li>
          <li><a class="nav-link" data-page="tasks" href="tasks.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12l3 3 5-6"/></svg></span><span class="label">Tasks</span><span class="count" data-count="tasks">0</span></a></li>
          <li><a class="nav-link" data-page="projects" href="projects.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg></span><span class="label">Projects</span></a></li>
          <li><a class="nav-link" data-page="team" href="team.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="8.5" r="2.6"/><path d="M15.8 14.2c2.7.4 4.7 2.4 4.7 5.8"/></svg></span><span class="label">Employees</span></a></li>
          <li><a class="nav-link" data-page="reports" href="reports.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M12 20V4M20 20v-7"/></svg></span><span class="label">Reports</span></a></li>
        </ul>

        <div class="sidebar-bottom">
          <a class="nav-link" data-page="settings" href="settings.html"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.97 7.97 0 0 0 0-2l2.1-1.6-2-3.4-2.5 1a8 8 0 0 0-1.7-1L14.9 3h-4l-.4 2.9a8 8 0 0 0-1.7 1l-2.5-1-2 3.4L6.5 11a7.97 7.97 0 0 0 0 2l-2.1 1.6 2 3.4 2.5-1a8 8 0 0 0 1.7 1l.4 2.9h4l.4-2.9a8 8 0 0 0 1.7-1l2.5 1 2-3.4L19.4 13z"/></svg></span><span class="label">Settings</span></a>
          <a class="nav-link" href="#" data-logout><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></span><span class="label">Logout</span></a>
        </div>
      </aside>

      <main class="main">
        <div class="content-top">
          <div class="eyebrow">Project overview</div>
          <h1 id="project-title">Project</h1>
        </div>

        <div class="content">
          <div class="project-detail-layout">
            <div class="card card-pad">
              <div id="project-summary"></div>
            </div>

            <div class="card card-pad">
              <div class="card-head">
                <h2>Team</h2>
              </div>
              <div id="project-team"></div>
            </div>
          </div>

          <div class="card card-pad" style="margin-top: 20px;">
            <div class="card-head">
              <h2>Tasks in this project</h2>
            </div>
            <div id="project-tasks"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script src="js/tasks.js"></script>
  <script src="js/projects.js"></script>
  <script>
    const user = requireAuth();
    if(user){
      initShell('projects', user);

      const params = new URLSearchParams(window.location.search);
      const projectId = params.get('id');
      const project = PROJECTS.find(p => p.id === projectId);

      const titleEl = document.getElementById('project-title');
      const summaryEl = document.getElementById('project-summary');
      const teamEl = document.getElementById('project-team');
      const tasksEl = document.getElementById('project-tasks');

      if(!project){
        titleEl.textContent = 'Project not found';
        summaryEl.innerHTML = '<div class="empty-state"><div class="glyph">📁</div><div>No project found.</div></div>';
      } else {
        titleEl.textContent = project.name;

        const projectTasks = Store.getTasks(user.email).filter(t => t.project === project.id);
        const teamMembers = project.team.length ? project.team : ['No team assigned'];

        summaryEl.innerHTML = `
          <div class="project-detail-header">
            <div>
              <div class="eyebrow">${project.status === 'done' ? 'Completed' : 'In progress'}</div>
              <h2>${project.name}</h2>
            </div>
            <span class="chip ${project.status === 'done' ? 'chip-done' : 'chip-active'}">${project.status === 'done' ? 'Done' : 'Active'}</span>
          </div>
          <p class="project-detail-desc">${project.desc}</p>
          <div class="project-detail-meta">
            <div><strong>Manager:</strong> ${project.projectManager}</div>
          </div>
          <div class="project-progress" style="margin-top: 18px;">
            <div class="project-progress-inline">
              <div class="bar-track"><div class="bar-fill" style="width:${project.progress}%"></div></div>
              <span class="project-progress-value">${project.progress}%</span>
            </div>
          </div>
        `;

        teamEl.innerHTML = teamMembers.map(member => {
          if(member === 'No team assigned'){
            return `
              <div class="team-card">
                <div class="avatar-lg">${initials('Team')}</div>
                <div class="who">
                  <div class="t-name">No team assigned</div>
                  <div class="t-role">No active members</div>
                </div>
              </div>
            `;
          } else {
            return `
              <a href="employee-detail.html?name=${encodeURIComponent(member)}" class="team-card team-card-link">
                <div class="avatar-lg">${initials(member)}</div>
                <div class="who">
                  <div class="t-name">${member}</div>
                  <div class="t-role">Project contributor</div>
                </div>
              </a>
            `;
          }
        }).join('');

        if(!projectTasks.length){
          tasksEl.innerHTML = '<div class="empty-state"><div class="glyph">☑</div><div>No tasks in this project yet.</div></div>';
        } else {
          tasksEl.innerHTML = projectTasks.map(task => `
            <div class="task-row ${task.done ? 'done' : ''}">
              <input type="checkbox" class="stamp" ${task.done ? 'checked' : ''} disabled />
              <div class="task-main">
                <div class="task-title">${escapeHTML(task.title)}</div>
                <div class="task-meta">
                  <span class="chip ${PRIORITY_CHIP[task.priority]}">${PRIORITY_LABEL[task.priority]}</span>
                  <span>added ${relativeDay(task.createdAt)}</span>
                </div>
              </div>
            </div>
          `).join('');
        }
      }
    }
  </script>
</body>
</html>
