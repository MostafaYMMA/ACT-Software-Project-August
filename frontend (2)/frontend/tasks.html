<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Tasks · ACT</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">

  <header class="header-bar">
    <div class="header-left">
      <button class="sidebar-toggle" data-sidebar-toggle aria-label="Toggle sidebar">
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/><path d="M14 9l-2 3 2 3"/></svg>
      </button>
      <div class="brand"><span class="mark">A</span><span class="brand-name">ACT</span></div>
    </div>
    <div class="header-right">
      <div class="profile-pill">
        <div class="avatar" data-user-avatar>—</div>
        <div class="who">
          <div class="name" data-user-name>—</div>
          <div class="role">Manager</div>
        </div>
      </div>
    </div>
  </header>

  <div class="body-row">

    <div class="sidebar-scrim" data-scrim></div>

    <aside class="sidebar">
      <ul class="nav-list">
        <li><a class="nav-link" data-page="dashboard" href="dashboard.html">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg></span>
          <span class="label">Dashboard</span>
        </a></li>
        <li><a class="nav-link" data-page="tasks" href="tasks.html">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12l3 3 5-6"/></svg></span>
          <span class="label">Tasks</span>
          <span class="count" data-count="tasks">0</span>
        </a></li>
        <li><a class="nav-link" data-page="projects" href="projects.html">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg></span>
          <span class="label">Projects</span>
        </a></li>
        <li><a class="nav-link" data-page="team" href="team.html">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="8.5" r="2.6"/><path d="M15.8 14.2c2.7.4 4.7 2.4 4.7 5.8"/></svg></span>
          <span class="label">Team</span>
        </a></li>
        <li><a class="nav-link" data-page="reports" href="reports.html">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M12 20V4M20 20v-7"/></svg></span>
          <span class="label">Reports</span>
        </a></li>
      </ul>

      <div class="sidebar-bottom">
        <a class="nav-link" data-page="settings" href="settings.html">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.97 7.97 0 0 0 0-2l2.1-1.6-2-3.4-2.5 1a8 8 0 0 0-1.7-1L14.9 3h-4l-.4 2.9a8 8 0 0 0-1.7 1l-2.5-1-2 3.4L6.5 11a7.97 7.97 0 0 0 0 2l-2.1 1.6 2 3.4 2.5-1a8 8 0 0 0 1.7 1l.4 2.9h4l.4-2.9a8 8 0 0 0 1.7-1l2.5 1 2-3.4L19.4 13z"/></svg></span>
          <span class="label">Settings</span>
        </a>
        <a class="nav-link" href="#" data-logout>
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></span>
          <span class="label">Logout</span>
        </a>
      </div>
    </aside>

    <main class="main">
      <div class="content-top">
        <div class="eyebrow">The list</div>
        <h1>Tasks</h1>
      </div>

      <div class="content">
        <div class="card card-pad">

          <!-- Search and Date Filter -->
          <div id="search-wrap" style="margin-bottom:12px; display:flex; gap:12px; align-items:stretch;">
            <div class="search" style="flex:1;">
              <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6"/><path d="M21 21l-4.35-4.35"/></svg>
              <input id="task-search" placeholder="Search tasks..." />
              <button id="search-clear" class="btn btn-ghost" style="display:none;" title="Clear search">✕</button>
            </div>
            <div id="date-filter-container" style="position:relative;">
              <button id="date-filter-btn" class="btn btn-ghost" style="display:flex; align-items:center; gap:6px; padding:8px 12px; border:1px solid var(--color-line); border-radius:4px; background:var(--color-surface); cursor:pointer;">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                <span id="date-filter-label">Date</span>
              </button>
              <div id="date-filter-menu" class="date-filter-popover" style="display:none; position:absolute; top:calc(100% + 8px); right:0; background:var(--color-surface); border:1px solid var(--color-line); border-radius:8px; box-shadow:0 4px 16px rgba(0,0,0,0.08); z-index:100; min-width:240px; padding:8px;">
                <div style="padding:8px; border-bottom:1px solid var(--color-line);">
                  <button class="date-preset" data-preset="today" style="width:100%; padding:8px; text-align:left; border:none; background:none; cursor:pointer; border-radius:4px; font-size:14px; color:var(--color-ink);">Today</button>
                  <button class="date-preset" data-preset="yesterday" style="width:100%; padding:8px; text-align:left; border:none; background:none; cursor:pointer; border-radius:4px; font-size:14px; color:var(--color-ink);">Yesterday</button>
                  <button class="date-preset" data-preset="week" style="width:100%; padding:8px; text-align:left; border:none; background:none; cursor:pointer; border-radius:4px; font-size:14px; color:var(--color-ink);">Last 7 days</button>
                  <button class="date-preset" data-preset="month" style="width:100%; padding:8px; text-align:left; border:none; background:none; cursor:pointer; border-radius:4px; font-size:14px; color:var(--color-ink);">Last 30 days</button>
                </div>
                <div style="padding:8px; border-bottom:1px solid var(--color-line);">
                  <button id="date-custom-toggle" style="width:100%; padding:8px; text-align:left; border:none; background:none; cursor:pointer; border-radius:4px; font-size:14px; color:var(--color-primary);">+ Custom range</button>
                </div>
                <div id="date-custom-form" style="display:none; padding:8px; gap:8px; display:flex; flex-direction:column;">
                  <div>
                    <label style="font-size:12px; color:var(--color-ink-soft); display:block; margin-bottom:4px;">From</label>
                    <input type="date" id="date-from" style="width:100%; padding:6px; border:1px solid var(--color-line); border-radius:4px; font-size:13px; background:var(--color-surface); color:var(--color-ink);"/>
                  </div>
                  <div>
                    <label style="font-size:12px; color:var(--color-ink-soft); display:block; margin-bottom:4px;">To</label>
                    <input type="date" id="date-to" style="width:100%; padding:6px; border:1px solid var(--color-line); border-radius:4px; font-size:13px; background:var(--color-surface); color:var(--color-ink);"/>
                  </div>
                  <div style="display:flex; gap:6px;">
                    <button id="date-apply" style="flex:1; padding:6px; background:var(--color-primary); color:white; border:none; border-radius:4px; cursor:pointer; font-size:13px; font-weight:500;">Apply</button>
                    <button id="date-clear-range" style="flex:1; padding:6px; background:var(--color-surface); border:1px solid var(--color-line); border-radius:4px; cursor:pointer; font-size:13px; color:var(--color-ink);">Clear</button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="tabs" style="margin-top:22px;">
            <button class="tab active" data-filter="all">All</button>
            <button class="tab" data-filter="open">Open</button>
            <button class="tab" data-filter="done">Completed</button>
          </div>

          <div id="loading-state" style="display:none; text-align:center; padding:40px; color:var(--color-ink-soft);">
            <div style="margin-bottom:12px;">Loading tasks...</div>
          </div>
          
          <div id="task-list"></div>
        </div>
      </div>
    </main>

  </div>
</div>

<script src="js/app.js"></script>
<script src="js/tasks.js"></script>
<script>
  const user = requireAuth();
  if(user){
    initShell('tasks', user);

    let currentFilter = 'all';
    let currentQuery = '';
    let datePreset = null;
    let dateCustomFrom = null;
    let dateCustomTo = null;
    let isLoading = false;
    let searchTimeout;

    const API_BASE = 'http://localhost:8000/api/v1';
    const token = localStorage.getItem('auth_token');

    const emptyMessages = {
      all:  'No tasks yet.',
      open: 'Nothing open — you\'re caught up.',
      done: 'No completed tasks yet.',
    };

    /**
     * Fetch tasks from the backend API with search and date filters.
     */
    async function fetchTasks() {
      isLoading = true;
      const loadingEl = document.getElementById('loading-state');
      const taskListEl = document.getElementById('task-list');
      loadingEl.style.display = 'block';
      taskListEl.innerHTML = '';

      try {
        const params = new URLSearchParams();
        
        if (currentQuery) {
          params.append('search', currentQuery);
        }
        
        if (dateCustomFrom) {
          params.append('from_date', dateCustomFrom);
        }
        if (dateCustomTo) {
          params.append('to_date', dateCustomTo);
        }

        const url = `${API_BASE}/tasks${params.toString() ? '?' + params.toString() : ''}`;
        const response = await fetch(url, {
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          }
        });

        if (!response.ok) {
          throw new Error(`API error: ${response.status}`);
        }

        const data = await response.json();
        const tasks = Array.isArray(data) ? data : [];
        
        // Apply status filter based on tab
        const filtered = applyStatusFilter(tasks, currentFilter);
        
        loadingEl.style.display = 'none';
        renderTasks(filtered);
      } catch (error) {
        console.error('Error fetching tasks:', error);
        loadingEl.style.display = 'none';
        taskListEl.innerHTML = `
          <div class="empty-state">
            <div class="glyph">⚠️</div>
            <div>Error loading tasks. Please try again.</div>
          </div>`;
      }
    }

    /**
     * Apply status filter based on current tab (all/open/done).
     */
    function applyStatusFilter(tasks, filter) {
      switch(filter) {
        case 'open':
          // "Open" = unassigned or unfinished tasks
          return tasks.filter(t => t.status !== 'completed');
        case 'done':
          // "Completed" = tasks marked as completed (if backend supports this)
          return tasks.filter(t => t.status === 'completed');
        default:
          // "All" = all tasks
          return tasks;
      }
    }

    /**
     * Render tasks to the DOM.
     */
    function renderTasks(tasks) {
      const container = document.getElementById('task-list');
      
      if (tasks.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <div class="glyph">&#9744;</div>
            <div>${emptyMessages[currentFilter] || 'No tasks found.'}</div>
          </div>`;
        return;
      }

      container.innerHTML = tasks.map(task => `
        <div class="task-row" data-id="${task.id}" data-status="${task.status || 'active'}">
          <button class="stamp status-${task.status || 'active'}" aria-label="Change task status"></button>
          <div class="task-main">
            <div class="task-title">${escapeHTML(task.title || '')}</div>
            <div class="task-meta">
              <span class="chip chip-med">${task.status || 'active'}</span>
              <span style="font-size:13px; color:var(--text-secondary);">
                ${new Date(task.created_at).toLocaleDateString()}
              </span>
            </div>
          </div>
          <button class="task-delete" aria-label="Delete task" title="Delete task">&times;</button>
        </div>`
      ).join('');
    }

    /**
     * Calculate date range from preset.
     */
    function getDateRangeForPreset(preset) {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      
      let fromDate, toDate = new Date(today);
      
      switch(preset) {
        case 'today':
          fromDate = new Date(today);
          break;
        case 'yesterday':
          fromDate = new Date(today);
          fromDate.setDate(fromDate.getDate() - 1);
          toDate = new Date(fromDate);
          break;
        case 'week':
          fromDate = new Date(today);
          fromDate.setDate(fromDate.getDate() - 7);
          break;
        case 'month':
          fromDate = new Date(today);
          fromDate.setDate(fromDate.getDate() - 30);
          break;
        default:
          return null;
      }
      
      return {
        from: fromDate.toISOString().split('T')[0],
        to: toDate.toISOString().split('T')[0]
      };
    }

    /**
     * Update date filter UI label.
     */
    function updateDateFilterLabel() {
      const label = document.getElementById('date-filter-label');
      if (dateCustomFrom || dateCustomTo) {
        label.textContent = `${dateCustomFrom || '?'} → ${dateCustomTo || '?'}`;
      } else if (datePreset) {
        const presets = {
          today: 'Today',
          yesterday: 'Yesterday',
          week: 'Last 7 days',
          month: 'Last 30 days'
        };
        label.textContent = presets[datePreset] || 'Date';
      } else {
        label.textContent = 'Date';
      }
    }

    /**
     * Debounced search handler.
     */
    function onSearchInput(value) {
      clearTimeout(searchTimeout);
      currentQuery = value.trim();
      searchTimeout = setTimeout(() => {
        fetchTasks();
      }, 300);
    }

    /**
     * Tab filter handler.
     */
    function onTabClick(filter) {
      currentFilter = filter;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelector(`.tab[data-filter="${filter}"]`).classList.add('active');
      fetchTasks();
    }

    /**
     * Date preset handler.
     */
    function applyDatePreset(preset) {
      const range = getDateRangeForPreset(preset);
      if (range) {
        dateCustomFrom = range.from;
        dateCustomTo = range.to;
        datePreset = preset;
        updateDateFilterLabel();
        closeDateFilter();
        fetchTasks();
      }
    }

    /**
     * Clear date filter.
     */
    function clearDateFilter() {
      datePreset = null;
      dateCustomFrom = null;
      dateCustomTo = null;
      document.getElementById('date-from').value = '';
      document.getElementById('date-to').value = '';
      updateDateFilterLabel();
      closeDateFilter();
      fetchTasks();
    }

    /**
     * Close date filter menu.
     */
    function closeDateFilter() {
      document.getElementById('date-filter-menu').style.display = 'none';
    }

    /**
     * Apply custom date range.
     */
    function applyCustomDateRange() {
      const fromVal = document.getElementById('date-from').value;
      const toVal = document.getElementById('date-to').value;
      
      if (!fromVal && !toVal) {
        alert('Please select at least one date.');
        return;
      }
      
      dateCustomFrom = fromVal || null;
      dateCustomTo = toVal || null;
      datePreset = null;
      updateDateFilterLabel();
      closeDateFilter();
      fetchTasks();
    }

    // Event listeners
    document.getElementById('task-search').addEventListener('input', (e) => {
      const clearBtn = document.getElementById('search-clear');
      clearBtn.style.display = e.target.value ? 'inline-flex' : 'none';
      onSearchInput(e.target.value);
    });

    document.getElementById('search-clear').addEventListener('click', () => {
      document.getElementById('task-search').value = '';
      currentQuery = '';
      document.getElementById('search-clear').style.display = 'none';
      fetchTasks();
    });

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        onTabClick(tab.dataset.filter);
      });
    });

    // Date filter button
    document.getElementById('date-filter-btn').addEventListener('click', () => {
      const menu = document.getElementById('date-filter-menu');
      menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
    });

    // Date presets
    document.querySelectorAll('.date-preset').forEach(btn => {
      btn.addEventListener('click', () => {
        applyDatePreset(btn.dataset.preset);
      });
    });

    // Custom date range toggle
    document.getElementById('date-custom-toggle').addEventListener('click', () => {
      const form = document.getElementById('date-custom-form');
      form.style.display = form.style.display === 'none' ? 'flex' : 'none';
    });

    // Custom date range buttons
    document.getElementById('date-apply').addEventListener('click', applyCustomDateRange);
    document.getElementById('date-clear-range').addEventListener('click', clearDateFilter);

    // Close date filter when clicking outside
    document.addEventListener('click', (e) => {
      if (!document.getElementById('date-filter-container').contains(e.target)) {
        closeDateFilter();
      }
    });

    // Initial load
    fetchTasks();
  }
</script>
</body>
</html>
