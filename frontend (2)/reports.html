<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reports · ACT</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">

  <header class="header-bar">
    <div class="header-left">
      <button class="sidebar-toggle" data-sidebar-toggle aria-label="Toggle sidebar">
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/><path d="M14 9l-2 3 2 3"/></svg>
      </button>
      <div class="brand"><span class="mark">A</span><span class="brand-name">ACT</span></div>
    </div>
    <div class="header-right">
      <div class="profile-pill">
        <div class="avatar" data-user-avatar>—</div>
        <div class="who">
          <div class="name" data-user-name>—</div>
          <div class="role">Manager</div>
        </div>
      </div>
    </div>
  </header>

  <div class="body-row">

    <div class="sidebar-scrim" data-scrim></div>

    <aside class="sidebar">
      <ul class="nav-list">
        <li><a class="nav-link" data-page="dashboard" href="dashboard.html">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/></svg></span>
          <span class="label">Dashboard</span>
        </a></li>
        <li><a class="nav-link" data-page="tasks" href="tasks.html">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12l3 3 5-6"/></svg></span>
          <span class="label">Tasks</span>
          <span class="count" data-count="tasks">0</span>
        </a></li>
        <li class="nav-group">
          <a class="nav-link" href="#" data-projects-toggle>
            <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg></span>
            <span class="label">Projects</span>
            <span class="chevron">⌄</span>
          </a>
          <ul class="nav-submenu" data-projects-submenu>
            <li><a class="nav-submenu-link" href="available-projects.html" data-submenu-page="available">Available Projects</a></li>
            <li><a class="nav-submenu-link" href="my-projects.html" data-submenu-page="my">My Projects</a></li>
          </ul>
        </li>
        <li><a class="nav-link" data-page="team" href="team.html">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><circle cx="17.5" cy="8.5" r="2.6"/><path d="M15.8 14.2c2.7.4 4.7 2.4 4.7 5.8"/></svg></span>
          <span class="label">Resource</span>
        </a></li>
        <li><a class="nav-link" data-page="reports" href="reports.html">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M12 20V4M20 20v-7"/></svg></span>
          <span class="label">Reports</span>
        </a></li>
      </ul>

      <div class="sidebar-bottom">
        <a class="nav-link" data-page="settings" href="settings.html">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a7.97 7.97 0 0 0 0-2l2.1-1.6-2-3.4-2.5 1a8 8 0 0 0-1.7-1L14.9 3h-4l-.4 2.9a8 8 0 0 0-1.7 1l-2.5-1-2 3.4L6.5 11a7.97 7.97 0 0 0 0 2l-2.1 1.6 2 3.4 2.5-1a8 8 0 0 0 1.7 1l.4 2.9h4l.4-2.9a8 8 0 0 0 1.7-1l2.5 1 2-3.4L19.4 13z"/></svg></span>
          <span class="label">Settings</span>
        </a>
        <a class="nav-link" href="#" data-logout>
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></span>
          <span class="label">Logout</span>
        </a>
      </div>
    </aside>

    <main class="main">
      <div class="content-top">
        <div class="eyebrow">The tally</div>
        <h1>Reports</h1>
      </div>

      <div class="content">
        <div class="stat-grid" id="stat-grid"></div>

        <div class="two-col">
          <div class="card card-pad">
            <div class="card-head"><h2>Open tasks by priority</h2></div>
            <div id="priority-bars"></div>
          </div>

          <div class="card card-pad">
            <div class="card-head"><h2>Completion</h2></div>
            <div style="text-align:center; padding: 8px 0 4px;">
              <div class="display" style="font-size:48px; color: var(--color-primary-darker);" id="completion-value">0%</div>
              <div class="mono" style="font-size:12px; color: var(--color-ink-soft); margin-top:6px;" id="completion-sub">0 of 0 tasks done</div>
            </div>
            <div class="bar-track" style="height:12px; margin-top:14px;">
              <div class="bar-fill" id="completion-fill" style="width:0%"></div>
            </div>
          </div>
        </div>

    <div class="two-col grid-gap">
  <div class="card card-pad">
    <div class="card-head">
      <h2 id="calendar-title">Calendar</h2>
      <div class="calendar-nav">
        <button class="cal-btn" id="cal-prev">‹</button>
        <button class="cal-btn" id="cal-today">Today</button>
        <button class="cal-btn" id="cal-next">›</button>
      </div>
    </div>
    <div class="calendar-weekdays" id="calendar-weekdays"></div>
    <div class="calendar-grid" id="calendar-grid"></div>
  </div>

  <div class="card card-pad">
    <div class="card-head"><h2 id="month-stats-title">This Month</h2></div>
    <div id="month-stats"></div>
  </div>
</div>
      </div>
    </main>

  </div>
</div>

<script src="js/app.js"></script>
<script src="js/projects.js"></script>
<script src="js/tasks.js"></script>
<script>
  const user = requireAuth();
  if(user){
    initShell('reports', user);

    const s = taskStats(user.email);

    document.getElementById('stat-grid').innerHTML = `
      <div class="stat-tile">
        <div class="label">Total tasks</div>
        <div class="value">${s.total}</div>
      </div>
      <div class="stat-tile">
        <div class="label">Open</div>
        <div class="value">${s.open}</div>
      </div>
      <div class="stat-tile">
        <div class="label">Completed</div>
        <div class="value">${s.done}</div>
      </div>
    `;

    const bars = [
      { label: 'High', value: s.byPriority.high },
      { label: 'Medium', value: s.byPriority.med },
      { label: 'Low', value: s.byPriority.low },
    ];
    const max = Math.max(1, ...bars.map(b => b.value));
    document.getElementById('priority-bars').innerHTML = bars.map(b => `
      <div class="bar-row">
        <div class="bar-label">${b.label}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(b.value / max) * 100}%"></div></div>
        <div class="bar-value">${b.value}</div>
      </div>
    `).join('');

    document.getElementById('completion-value').textContent = s.completion + '%';
    document.getElementById('completion-sub').textContent = `${s.done} of ${s.total} tasks done`;
    document.getElementById('completion-fill').style.width = s.completion + '%';

    // ===== Calendar =====
    const allTasks = Store.getTasks(user.email);
    let calDate = new Date();
    calDate.setDate(1);

    const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
    const weekdayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

    const weekdaysEl = document.getElementById('calendar-weekdays');
    weekdaysEl.style.cssText = 'display:grid; grid-template-columns:repeat(7,1fr); margin-top:12px; font-size:12px; color:#999; text-align:center;';
    weekdaysEl.innerHTML = weekdayNames.map(w => `<div>${w}</div>`).join('');

    function tasksOnDay(dayStart){
      const dayEnd = new Date(dayStart); dayEnd.setDate(dayStart.getDate() + 1);
      return allTasks.filter(t => t.createdAt >= dayStart.getTime() && t.createdAt < dayEnd.getTime());
    }
    function renderMonthStats(year, month){
  const monthStart = new Date(year, month, 1).getTime();
  const monthEnd = new Date(year, month + 1, 1).getTime();

  const monthTasks = allTasks.filter(t => t.createdAt >= monthStart && t.createdAt < monthEnd);
const doneTasks = monthTasks.filter(t =>
  t.status === 'done' ||
  t.status === 'Done' ||
  t.status === 'completed' ||
  t.completed === true ||
  t.done === true ||
  t.isDone === true ||
  !!t.completedAt
);
  const added = monthTasks.length;
  const done = doneTasks.length;
  const rate = added > 0 ? Math.round((done / added) * 100) : 0;

  document.getElementById('month-stats').innerHTML = `
    <div style="display:flex; flex-direction:column; gap:16px;">
      <div style="display:flex; justify-content:space-between; align-items:baseline;">
        <div style="font-size:13px; color:var(--color-ink-soft);">Tasks added</div>
        <div style="font-family:var(--font-display); font-size:26px; color:var(--color-primary-darker);">${added}</div>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:baseline;">
        <div style="font-size:13px; color:var(--color-ink-soft);">Tasks completed</div>
        <div style="font-family:var(--font-display); font-size:26px; color:var(--color-good);">${done}</div>
      </div>
      <div>
        <div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;">
          <div style="font-size:13px; color:var(--color-ink-soft);">Completion rate</div>
          <div style="font-family:var(--font-display); font-size:20px; color:var(--color-primary-darker);">${rate}%</div>
        </div>
        <div class="bar-track" style="height:10px;">
          <div class="bar-fill" style="width:${rate}%"></div>
        </div>
      </div>
    </div>
  `;
}
    function renderCalendar(){
      const year = calDate.getFullYear();
      const month = calDate.getMonth();

      document.getElementById('calendar-title').textContent = `${monthNames[month]} ${year}`;
      document.getElementById('month-stats-title').textContent = `${monthNames[month]} ${year} — Summary`;
      renderMonthStats(year, month);
      const firstDay = new Date(year, month, 1);
      const startOffset = firstDay.getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      const today = new Date();
      today.setHours(0,0,0,0);

      let cells = '';

      for(let i = 0; i < startOffset; i++){
        cells += `<div></div>`;
      }

      for(let day = 1; day <= daysInMonth; day++){
        const cellDate = new Date(year, month, day);
        cellDate.setHours(0,0,0,0);
        const dayTasks = tasksOnDay(cellDate);
        const isToday = cellDate.getTime() === today.getTime();

        cells += `
<div style="height:50px; border-radius:8px; background:var(--color-line); padding:6px; display:flex; flex-direction:column; justify-content:space-between; ${isToday ? 'outline:2px solid var(--color-primary);' : ''}">
  <div style="font-size:12px; color:var(--color-ink-soft);">${day}</div>${dayTasks.length > 0 ? (() => {

  const priorityColorMap = {  };
  const priorityRank = { high: 3, med: 2, low: 1 };
  const topTask = [...dayTasks].sort((a, b) => (priorityRank[b.priority] || 0) - (priorityRank[a.priority] || 0))[0];
  const color = priorityColorMap[topTask.priority] || '#ff6a00';
return `<div style="align-self:flex-end; margin-top:-6px; background:${color}; color:#111; font-size:11px; font-weight:750; border-radius:50%; width:18px; height:18px; display:flex; align-items:center; justify-content:center;">${dayTasks.length}</div>`;})() : ''}          </div>
        `;
      }

      const gridEl = document.getElementById('calendar-grid');
      gridEl.style.cssText = 'display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-top:6px;';
      gridEl.innerHTML = cells;
    }

    document.getElementById('cal-prev').addEventListener('click', () => {
      calDate.setMonth(calDate.getMonth() - 1);
      renderCalendar();
    });
    document.getElementById('cal-next').addEventListener('click', () => {
      calDate.setMonth(calDate.getMonth() + 1);
      renderCalendar();
    });
    document.getElementById('cal-today').addEventListener('click', () => {
      calDate = new Date();
      calDate.setDate(1);
      renderCalendar();
    });

    renderCalendar();

    updateNavCounts(user.email);
  }
</script>
</body>
</html>
